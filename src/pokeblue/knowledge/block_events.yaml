  - {map: SILPH_CO_11F, block: [3, 6], event: EVENT_SILPH_CO_11_UNLOCKED_DOOR, when_set: false, block_id: 0x20, source: scripts/SilphCo11F.asm}

  # ── Manoir Pokémon : barrières inversées par l'interrupteur ─────────────────────
  - {map: POKEMON_MANSION_1F, block: [12, 6], event: EVENT_MANSION_SWITCH_ON, when_set: false, block_id: 0x0E, source: scripts/PokemonMansion1F.asm Mansion1CheckReplaceSwitchDoorBlocks}
