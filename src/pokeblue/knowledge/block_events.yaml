# Blocs de carte remplacés par les scripts selon un drapeau d'événement.
#
# Le fichier .blk d'une carte n'est que son état initial : au chargement, certains
# scripts appellent ReplaceTileBlock selon un event flag (barrières de la Route
# Victoire, portes de Sylphe SARL, interrupteurs du Manoir…). Ces appels passent
# souvent par des sous-programmes, donc ce fichier est relu à la main, script par
# script. tests/test_block_events.py vérifie qu'il concorde avec une extraction
# automatique sur les scripts de forme simple.
#
# Champs : map, block [x, y] (en blocs : `lb bc, y, x` dans le script), event,
# when_set (le remplacement a lieu si l'événement est actif, ou s'il ne l'est pas),
# block_id (nouveau bloc), source ; solvable_with : capacité qui permet au joueur
# d'activer l'événement lui-même (pousser un rocher sur l'interrupteur avec Force).

block_events:
  # ── Route Victoire : un rocher sur l'interrupteur ouvre la barrière ─────────────
  - {map: VICTORY_ROAD_1F, block: [4, 6], event: EVENT_VICTORY_ROAD_1_BOULDER_ON_SWITCH, when_set: true, solvable_with: STRENGTH, block_id: 0x1D, source: scripts/VictoryRoad1F.asm VictoryRoad1F_Script}
  - {map: VICTORY_ROAD_2F, block: [3, 4], event: EVENT_VICTORY_ROAD_2_BOULDER_ON_SWITCH1, when_set: true, solvable_with: STRENGTH, block_id: 0x15, source: scripts/VictoryRoad2F.asm VictoryRoad2FCheckBoulderEventScript}
  - {map: VICTORY_ROAD_2F, block: [11, 7], event: EVENT_VICTORY_ROAD_2_BOULDER_ON_SWITCH2, when_set: true, solvable_with: STRENGTH, block_id: 0x1D, source: scripts/VictoryRoad2F.asm VictoryRoad2FCheckBoulderEventScript}
  - {map: VICTORY_ROAD_3F, block: [3, 5], event: EVENT_VICTORY_ROAD_3_BOULDER_ON_SWITCH1, when_set: true, solvable_with: STRENGTH, block_id: 0x1D, source: scripts/VictoryRoad3F.asm VictoryRoad3FCheckBoulderEventScript}

  # ── Conseil 4 : sortie ouverte une fois le dresseur battu ───────────────────────
  - {map: LORELEIS_ROOM, block: [2, 0], event: EVENT_BEAT_LORELEIS_ROOM_TRAINER_0, when_set: true, block_id: 0x24, source: scripts/LoreleisRoom.asm}
  - {map: BRUNOS_ROOM, block: [2, 0], event: EVENT_BEAT_BRUNOS_ROOM_TRAINER_0, when_set: true, block_id: 0x24, source: scripts/BrunosRoom.asm}
  - {map: AGATHAS_ROOM, block: [2, 0], event: EVENT_BEAT_AGATHAS_ROOM_TRAINER_0, when_set: true, block_id: 0x3B, source: scripts/AgathasRoom.asm}
  - {map: LANCES_ROOM, block: [2, 6], event: EVENT_LANCES_ROOM_LOCK_DOOR, when_set: false, block_id: 0x31, source: scripts/LancesRoom.asm LanceShowOrHideEntranceBlocks}
  - {map: LANCES_ROOM, block: [3, 6], event: EVENT_LANCES_ROOM_LOCK_DOOR, when_set: false, block_id: 0x32, source: scripts/LancesRoom.asm LanceShowOrHideEntranceBlocks}
  - {map: LANCES_ROOM, block: [2, 6], event: EVENT_LANCES_ROOM_LOCK_DOOR, when_set: true, block_id: 0x72, source: scripts/LancesRoom.asm LanceShowOrHideEntranceBlocks}
  - {map: LANCES_ROOM, block: [3, 6], event: EVENT_LANCES_ROOM_LOCK_DOOR, when_set: true, block_id: 0x73, source: scripts/LancesRoom.asm LanceShowOrHideEntranceBlocks}

  # ── Céladopole : l'interrupteur derrière l'affiche révèle l'escalier ────────────
  - {map: GAME_CORNER, block: [8, 2], event: EVENT_FOUND_ROCKET_HIDEOUT, when_set: false, block_id: 0x2A, source: scripts/GameCorner.asm GameCornerSetRocketHideoutDoorTile}
  - {map: GAME_CORNER, block: [8, 2], event: EVENT_FOUND_ROCKET_HIDEOUT, when_set: true, block_id: 0x43, source: scripts/GameCorner.asm GameCornerPosterText}

  # ── Repaire Rocket ──────────────────────────────────────────────────────────────
  - {map: ROCKET_HIDEOUT_B1F, block: [12, 8], event: EVENT_BEAT_ROCKET_HIDEOUT_1_TRAINER_4, when_set: false, block_id: 0x54, source: scripts/RocketHideoutB1F.asm}
  - {map: ROCKET_HIDEOUT_B1F, block: [12, 8], event: EVENT_BEAT_ROCKET_HIDEOUT_1_TRAINER_4, when_set: true, block_id: 0x0E, source: scripts/RocketHideoutB1F.asm}
  - {map: ROCKET_HIDEOUT_B4F, block: [12, 5], event: EVENT_ROCKET_HIDEOUT_4_DOOR_UNLOCKED, when_set: false, block_id: 0x2D, source: scripts/RocketHideoutB4F.asm}

  # ── Arène de Carmin : porte fermée tant que la 2e serrure n'est pas ouverte ─────
  - {map: VERMILION_GYM, block: [2, 2], event: EVENT_2ND_LOCK_OPENED, when_set: false, block_id: 0x24, source: scripts/VermilionGym.asm}

  # ── Sylphe SARL : portes verrouillées tant que la Carte Magnétique n'a pas servi ─
