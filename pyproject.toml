[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pokemon-blue-experiments"
version = "0.2.0"
description = "Agent modulaire pour Pokémon Bleu : état lu en RAM, base de connaissance Gen 1 et petits modèles RL"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Maxime", email = "9865@holbertonstudents.com"}
]
keywords = ["pokemon", "reinforcement-learning", "game-ai", "pyboy", "gymnasium"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

# Uniquement ce qui est réellement importé par le code.
dependencies = [
    "pyboy==2.6.1",
    "numpy>=1.26",
    "gymnasium>=0.29.1",
    "stable-baselines3>=2.8",
    "sb3-contrib>=2.8",
    "torch>=2.2",
    "tensorboard>=2.16",     # logs d'entraînement SB3
    "imageio>=2.34",         # GIF de debug
    "pillow>=10.0",
    "pyyaml>=6.0",           # configs et manifestes de savestates
]

[project.scripts]
pokeblue = "pokeblue.cli:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pyright>=1.1.380",
]
# Outils interactifs de debug (fenêtres OpenCV, contrôle clavier manuel).
tools = [
    "opencv-python>=4.9",
    "pynput>=1.7",
]
# Backend de vectorisation optionnel (src/agent/vectorization.py, scripts/benchmark_envs.py).
puffer = [
    "pufferlib>=3.0",
]

[project.urls]
Homepage = "https://github.com/MaKSiiMe/PokemonBlueExperiments"
Repository = "https://github.com/MaKSiiMe/PokemonBlueExperiments"
Documentation = "https://github.com/MaKSiiMe/PokemonBlueExperiments/tree/main/docs"

# Nouveau code : paquet `pokeblue` (src-layout). L'ancien code (`src/agent`,
# `src/emulator`, `src/knowledge`, `src/utils`) s'importe encore en `src.*`
# depuis la racine du repo, le temps de sa migration.
[tool.setuptools.packages.find]
where = ["src"]
include = ["pokeblue*"]

[tool.setuptools.package-data]
"pokeblue.knowledge" = ["data/*.json", "data/maps/*.json", "*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    ".cache",
    "data",
    "datasets",
    "models",
    "runs",
    "debug_output",
    "docs/archive",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (temporaire pour migration)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["pokeblue", "src"]

[tool.pyright]
pythonVersion = "3.12"
include = ["src"]
exclude = [
    "**/__pycache__",
    ".venv",
    "data",
    "datasets",
    "models",
]
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# `src` pour `pokeblue` sans installation, `.` pour l'ancien code `src.*`.
pythonpath = ["src", "."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: tests longs (>10s)",
]
addopts = [
    "--strict-markers",
    "--tb=short",
    "--cov=src",
    "--cov-report=term-missing",
]
